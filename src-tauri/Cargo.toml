[package]
name = "win-island"
version = "0.1.0"
description = "Win Island — a Dynamic Island style top bar for Windows 11"
authors = ["dubrik"]
edition = "2024"

[lib]
name = "win_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WinRT projection. Already in the dependency graph via Tauri, so only the
# feature-gated modules below are compiled — used for SMTC (now playing).
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# The `#[implement]` macro emits `::windows_core::…` paths, so the core crate
# has to be a direct dependency as well.
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
